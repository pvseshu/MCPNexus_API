services:
  web:
    build: .
    container_name: mcpnexus-web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: host.docker.internal
      QDRANT_URL: http://host.docker.internal:6333
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - models:/models

volumes:
  models:
